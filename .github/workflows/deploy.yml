name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Neon tests skip themselves without ANTRESOL_NEON_TEST_URL.
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

      - id: pages
        uses: actions/configure-pages@v6

      # base_path is empty on a custom domain or a <user>.github.io repository, and "/antresol" otherwise.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: NUXT_APP_BASE_URL="${BASE_PATH%/}/" pnpm --filter @antresol/app generate

      # The generated worker must evaluate (it throws non-precached-url when the app shell is not precached under the base
      # URL), precache that URL, and precache no font but the default style's.
      - name: Check the service worker
        run: node packages/app/scripts/check-sw.mjs packages/app/.output/public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/app/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
